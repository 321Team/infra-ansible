# P1-SEC-01 #58 — externalTrafficPolicy: Local Source IP 보존 증적 자동 수집
#
# 실행 (ansible01 제어 노드에서, 기존 CR 스크립트와 동일한 방식):
#   ansible-playbook -i inventory/hosts.yml playbooks/p1-sec-01-b2-collect-58.yml
#
# 정본 inventory/hosts.yml(k8s_control_plane/k8s_workers/edge)을 그대로 쓰며
# 별도 인벤토리/개인 계정/비밀번호 인증을 추가하지 않는다. Pod IP는 재배치될
# 수 있으므로 인벤토리에 고정하지 않고 이 playbook이 매 실행마다 조회한다.
#
# 결과: {{ out }}(기본 ~/evidence-58/)에 00_cluster-state.txt,
# tcpdump_<worker>.txt x3, curl_<worker>.txt x3, SUMMARY.txt

- name: "[0] control plane — 클러스터 상태 저장 및 Pod IP 조회"
  hosts: k8s_control_plane
  run_once: true
  gather_facts: false
  vars:
    out: "{{ lookup('env', 'HOME') }}/evidence-58"
  tasks:
    - name: 로컬 저장 폴더 생성
      delegate_to: localhost
      file:
        path: "{{ out }}"
        state: directory

    - name: node / pod / svc 상태 기록
      become: true
      shell: |
        K="kubectl --kubeconfig=/etc/kubernetes/admin.conf"
        {
          echo "### $(date '+%F %T %Z') host=$(hostname)"
          echo "### nodes";  $K get node -o wide
          echo "### pods";   $K -n fds-app get pod -o wide | grep transaction-api
          echo "### svc";    $K -n fds-app get svc -o custom-columns=NAME:.metadata.name,TYPE:.spec.type,POLICY:.spec.externalTrafficPolicy,NODEPORT:.spec.ports[*].nodePort
        } > /tmp/00_cluster-state.txt 2>&1
        cat /tmp/00_cluster-state.txt
      register: state
      changed_when: false

    - name: externalTrafficPolicy=Local + 30080 확인
      assert:
        that:
          - state.stdout is search('Local')
          - state.stdout is search('30080')
        fail_msg: "svc에서 Local / 30080 이 안 보임 — 00_cluster-state.txt 확인 필요"

    - name: 워커별 실제 transaction-api Pod IP 조회 (nodeName -> podIP)
      become: true
      command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n fds-app get pod
        -l app=transaction-api
        -o jsonpath={.items[*].spec.nodeName}{"|"}{.items[*].status.podIP}
      register: pod_lookup
      changed_when: false

    - name: nodeName -> podIP 매핑을 fact로 저장 (다음 Play에서 hostvars로 참조)
      vars:
        node_names: "{{ pod_lookup.stdout.split('|')[0].split() }}"
        pod_ips: "{{ pod_lookup.stdout.split('|')[1].split() }}"
      set_fact:
        worker_pod_ips: "{{ dict(node_names | zip(pod_ips)) }}"

    - name: 워커마다 실제 Pod가 존재하는지 확인 (Pod 재생성/미배치 대비)
      assert:
        that: item in worker_pod_ips
        fail_msg: "{{ item }}에 transaction-api Pod가 없음 — 배치 확인 후 재실행"
      loop: "{{ groups['k8s_workers'] }}"

    - name: 가져오기
      fetch:
        src: /tmp/00_cluster-state.txt
        dest: "{{ out }}/00_cluster-state.txt"
        flat: true

- name: "[1~3] 워커별 tcpdump + edge01 curl"
  hosts: k8s_workers
  serial: 1                       # 한 대씩 순서대로
  gather_facts: false
  vars:
    out: "{{ lookup('env', 'HOME') }}/evidence-58"
    control_host: "{{ groups['k8s_control_plane'][0] }}"
    pod_ip: "{{ hostvars[control_host].worker_pod_ips[inventory_hostname] }}"
    edge_ip: "{{ hostvars[groups['edge'][0]].ansible_host }}"
    td_file: "/tmp/tcpdump_{{ inventory_hostname }}.txt"
    curl_file: "/tmp/curl_{{ inventory_hostname }}.txt"
  tasks:
    - name: Pod veth(cali) 이름 찾기
      shell: ip route | awk '$1=="{{ pod_ip }}" {print $3}'
      register: ifc
      changed_when: false
      failed_when: ifc.stdout == ""

    - name: tcpdump 백그라운드 시작 (최대 30초, 노드 자신의 probe 제외)
      become: true
      shell: |
        {
          echo "### $(date '+%F %T %Z') host=$(hostname) if={{ ifc.stdout }} pod={{ pod_ip }}"
          timeout 30 tcpdump -i {{ ifc.stdout }} -n -l -tttt "tcp port 8000 and not host {{ ansible_host }}" -c 5 2>&1
        } > {{ td_file }}
      async: 45
      poll: 0
      register: td_job

    - name: tcpdump가 listening 상태가 될 때까지 대기
      pause:
        seconds: 3

    - name: edge01에서 curl
      delegate_to: "{{ groups['edge'][0] }}"
      shell: |
        {
          echo "### $(date '+%F %T %Z') from=$(hostname) $(hostname -I)"
          curl -sv --max-time 10 http://{{ ansible_host }}:30080/readyz 2>&1
        } > {{ curl_file }}
        cat {{ curl_file }}
      register: curl_out
      changed_when: false

    - name: tcpdump 종료 대기
      become: true
      async_status:
        jid: "{{ td_job.ansible_job_id }}"
      register: td_done
      until: td_done.finished
      retries: 15
      delay: 3

    - name: tcpdump 결과 읽기
      become: true
      command: cat {{ td_file }}
      register: td_out
      changed_when: false

    - name: "판정 — 출발지 {{ edge_ip }}가 Pod에 도착했는가 / HTTP 200인가"
      assert:
        that:
          - td_out.stdout is search('^' ~ (edge_ip | regex_escape()) ~ '\.[0-9]+ > ' ~ (pod_ip | regex_escape()), multiline=True)
          - curl_out.stdout is search('HTTP/1.1 200')
        fail_msg: "{{ inventory_hostname }}: Source IP 보존 또는 200 응답 미확인 — 파일 내용 확인 필요"
        success_msg: "{{ inventory_hostname }}: {{ edge_ip }} → {{ pod_ip }} 보존 확인, HTTP 200"
      ignore_errors: true
      register: verdict

    - name: tcpdump 파일 가져오기
      become: true
      fetch:
        src: "{{ td_file }}"
        dest: "{{ out }}/tcpdump_{{ inventory_hostname }}.txt"
        flat: true

    - name: curl 파일 가져오기
      delegate_to: "{{ groups['edge'][0] }}"
      fetch:
        src: "{{ curl_file }}"
        dest: "{{ out }}/curl_{{ inventory_hostname }}.txt"
        flat: true

    - name: 판정 결과 기록
      delegate_to: localhost
      lineinfile:
        path: "{{ out }}/SUMMARY.txt"
        create: true
        regexp: "^{{ inventory_hostname }} "
        line: "{{ inventory_hostname }} node={{ ansible_host }} pod={{ pod_ip }} if={{ ifc.stdout }} => {{ 'PASS' if not (verdict.failed | default(false)) else 'CHECK' }}"
