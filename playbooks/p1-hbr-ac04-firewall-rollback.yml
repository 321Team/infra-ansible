---
- name: Roll back P1-HBR-01 AC-04 nftables forward guard
  hosts: harbor
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Verify inventory identity
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == expected_hostname
          - ansible_host == '10.1.93.54'

    - name: Require explicit rollback approval
      ansible.builtin.assert:
        that:
          - p1_hbr_ac04_rollback_approved | default('') == p1_hbr_ac04_change_id

    - name: Read sealed original state
      ansible.builtin.slurp:
        src: "{{ p1_hbr_ac04_state_dir }}/original-state.json"
      register: original_state_file

    - name: Decode original state
      ansible.builtin.set_fact:
        original_state: "{{ original_state_file.content | b64decode | from_json }}"

    - name: Validate rollback binding
      ansible.builtin.assert:
        that:
          - original_state.change_id == p1_hbr_ac04_change_id
          - original_state.hostname == ansible_facts['hostname']
          - original_state.source_records == p1_hbr_ac04_sources
          - not original_state.nft_file_preexisted
          - not original_state.unit_file_preexisted

    - name: Verify sealed prestate hashes
      ansible.builtin.shell: |
        cd {{ p1_hbr_ac04_state_dir | quote }}
        sha256sum -c PRESTATE_SHA256SUMS
      args:
        executable: /bin/bash
      register: prestate_hash
      changed_when: false

  tasks:
    - name: Restore permanent generic 443 before removing guard
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone={{ p1_hbr_ac04_zone }}
          - --add-port={{ p1_hbr_ac04_port }}/tcp
      when: original_state.permanent_generic_443_before | bool
      register: restore_permanent
      changed_when: "'ALREADY_ENABLED' not in (restore_permanent.stdout | default(''))"

    - name: Restore runtime generic 443 before removing guard
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone={{ p1_hbr_ac04_zone }}
          - --add-port={{ p1_hbr_ac04_port }}/tcp
      when: original_state.runtime_generic_443_before | bool
      register: restore_runtime
      changed_when: "'ALREADY_ENABLED' not in (restore_runtime.stdout | default(''))"

    - name: Disable and stop persistent guard
      ansible.builtin.systemd:
        name: p1-hbr-ac04-firewall.service
        enabled: false
        state: stopped

    - name: Remove managed nft definition
      ansible.builtin.file:
        path: /etc/nftables/p1-hbr-ac04.nft
        state: absent

    - name: Remove managed persistence unit
      ansible.builtin.file:
        path: /etc/systemd/system/p1-hbr-ac04-firewall.service
        state: absent

    - name: Reload systemd unit metadata
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Verify managed nft table is absent
      ansible.builtin.command:
        argv: [nft, list, table, inet, p1_hbr_ac04]
      register: table_after
      changed_when: false
      failed_when: false

    - name: Query runtime generic 443 after rollback
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: runtime_443_after
      changed_when: false
      failed_when: false

    - name: Query permanent generic 443 after rollback
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: permanent_443_after
      changed_when: false
      failed_when: false

    - name: Verify original broad state is restored
      ansible.builtin.assert:
        that:
          - table_after.rc != 0
          - (runtime_443_after.rc == 0) == (original_state.runtime_generic_443_before | bool)
          - (permanent_443_after.rc == 0) == (original_state.permanent_generic_443_before | bool)

    - name: Capture exact rollback completion timestamp
      ansible.builtin.command:
        argv: [date, --iso-8601=seconds]
      register: rollback_timestamp
      changed_when: false

    - name: Save rollback completion marker
      ansible.builtin.copy:
        dest: "{{ p1_hbr_ac04_state_dir }}/ROLLED_BACK.json"
        owner: root
        group: root
        mode: "0600"
        content: |
          {{
            {
              'change_id': p1_hbr_ac04_change_id,
              'rolled_back_at': rollback_timestamp.stdout | trim,
              'generic_443_restored': true,
              'managed_nft_table_removed': true
            } | to_nice_json
          }}

    - name: Print rollback verdict
      ansible.builtin.debug:
        msg:
          change_id: "{{ p1_hbr_ac04_change_id }}"
          host: "{{ inventory_hostname }}"
          state: ROLLBACK_PASS_ORIGINAL_NONCOMPLIANT_STATE
