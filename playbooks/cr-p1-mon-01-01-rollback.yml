---
- name: CR-P1-MON-01-01 guard against an empty egress_proxy target group
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Fail loudly instead of a silent no-op when no target host is selected
      ansible.builtin.assert:
        that:
          - groups['egress_proxy'] | default([]) | length > 0
        fail_msg: >-
          NOT RUN: the egress_proxy inventory group is empty. Select the
          target host(s) in inventory/hosts.yml before running rollback; an
          empty-group exit code 0 must not be treated as rollback evidence.

- name: CR-P1-MON-01-01 rollback egress proxy configuration
  hosts: egress_proxy
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Validate rollback approval token
      ansible.builtin.assert:
        that:
          - cr_mon_rollback_approved | default('') == cr_mon_change_id
        fail_msg: >-
          Set cr_mon_rollback_approved={{ cr_mon_change_id }} for an approved
          rollback run.

    - name: Read preserved original squid presence state
      ansible.builtin.slurp:
        src: "{{ cr_mon_state_dir }}/original-state.json"
      register: cr_mon_original_state_file

    - name: Decode preserved original squid presence state
      ansible.builtin.set_fact:
        cr_mon_original_state: >-
          {{ cr_mon_original_state_file.content | b64decode | from_json }}

    - name: Validate preserved state ownership
      ansible.builtin.assert:
        that:
          - cr_mon_original_state.change_id == cr_mon_change_id
          - cr_mon_original_state.inventory_hostname == inventory_hostname
        fail_msg: >-
          Preserved egress proxy state does not belong to this change or host.

  tasks:
    - name: Stop and disable squid when it was not present before this change
      ansible.builtin.service:
        name: squid
        state: stopped
        enabled: false
      when: not cr_mon_original_state.squid_preinstalled

    - name: Restore original squid configuration when it existed before this change
      ansible.builtin.copy:
        remote_src: true
        src: "{{ cr_mon_state_dir }}/original-squid.conf"
        dest: /etc/squid/squid.conf
        owner: "{{ cr_mon_original_state.squid_conf_owner | default('root') }}"
        group: "{{ cr_mon_original_state.squid_conf_group | default('root') }}"
        mode: "{{ cr_mon_original_state.squid_conf_mode | default('0644') }}"
      when:
        - cr_mon_original_state.squid_preinstalled
        - cr_mon_original_state.squid_conf_preexisted

    - name: Restore squid to its exact pre-change active/enabled state
      ansible.builtin.service:
        name: squid
        state: >-
          {{ 'started' if cr_mon_original_state.squid_service_active_state == 'active'
             else 'stopped' }}
        enabled: >-
          {{ cr_mon_original_state.squid_service_enabled_state
             in ['enabled', 'enabled-runtime', 'static'] }}
      when: cr_mon_original_state.squid_preinstalled

    - name: Remove only the firewalld rich rules this change introduced
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --remove-rich-rule=rule family="ipv4" source
            address="{{ item }}" port port="{{ cr_mon_proxy_port }}"
            protocol="tcp" accept
      loop: "{{ cr_mon_proxy_allowed_clients }}"
      register: cr_mon_firewalld_remove
      when: >-
        ('source address=\"' + item + '\" port port=\"' + (cr_mon_proxy_port | string) + '\" protocol=\"tcp\" accept')
        not in (cr_mon_original_state.firewalld_permanent_rules_before | default([]) | join('\n'))
      failed_when: >-
        cr_mon_firewalld_remove.rc != 0
        and 'NOT_ENABLED' not in (cr_mon_firewalld_remove.stderr | default(''))
        and 'NOT_ENABLED' not in (cr_mon_firewalld_remove.stdout | default(''))

    - name: Reload firewalld after removing this change's rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      when: cr_mon_firewalld_remove.changed | default(false)
      changed_when: true

    - name: Read runtime-only firewalld rich rules after the rollback reload
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --list-rich-rules
      register: cr_mon_firewalld_runtime_after_rollback
      changed_when: false
      when: cr_mon_firewalld_remove.changed | default(false)

    - name: Restore pre-existing runtime-only firewalld rules dropped by the rollback reload
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --add-rich-rule={{ item }}
      loop: "{{ cr_mon_original_state.firewalld_runtime_rules_before | default([]) }}"
      when:
        - cr_mon_firewalld_remove.changed | default(false)
        - item not in cr_mon_firewalld_runtime_after_rollback.stdout_lines
      changed_when: true

    - name: Print rollback verdict
      ansible.builtin.debug:
        msg:
          change_id: "{{ cr_mon_change_id }}"
          host: "{{ inventory_hostname }}"
          squid_preinstalled: "{{ cr_mon_original_state.squid_preinstalled }}"
          restored_active_state: "{{ cr_mon_original_state.squid_service_active_state | default('n/a') }}"
          restored_enabled_state: "{{ cr_mon_original_state.squid_service_enabled_state | default('n/a') }}"
          proxy_state: ROLLED_BACK
