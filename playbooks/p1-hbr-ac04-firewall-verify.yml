---
- name: Verify P1-HBR-01 AC-04 nftables forward guard
  hosts: harbor
  gather_facts: true
  become: true
  any_errors_fatal: true

  tasks:
    - name: Verify inventory identity
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == expected_hostname
          - ansible_host == '10.1.93.54'

    - name: Query runtime generic 443
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: runtime_443
      changed_when: false
      failed_when: false

    - name: Query permanent generic 443
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: permanent_443
      changed_when: false
      failed_when: false

    - name: Read managed nft table
      ansible.builtin.command:
        argv: [nft, list, table, inet, p1_hbr_ac04]
      register: nft_table
      changed_when: false

    - name: Verify persistent service is enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, p1-hbr-ac04-firewall.service]
      register: service_enabled
      changed_when: false

    - name: Verify persistent service is active
      ansible.builtin.command:
        argv: [systemctl, is-active, p1-hbr-ac04-firewall.service]
      register: service_active
      changed_when: false

    - name: Verify service boot ordering
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - p1-hbr-ac04-firewall.service
          - --property=Before
          - --property=After
      register: service_order
      changed_when: false

    - name: Verify StrictForwardPorts was not changed
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^StrictForwardPorts=
          - /etc/firewalld/firewalld.conf
      register: strict_forward_ports
      changed_when: false

    - name: Validate permanent firewalld config
      ansible.builtin.command:
        argv: [firewall-cmd, --check-config]
      register: fw_check
      changed_when: false

    - name: Verify sealed prestate hashes before comparison
      ansible.builtin.shell: |
        cd {{ p1_hbr_ac04_state_dir | quote }}
        sha256sum -c PRESTATE_SHA256SUMS
      args:
        executable: /bin/bash
      register: prestate_hash
      changed_when: false

    - name: Read sealed IPv4 Docker rules
      ansible.builtin.slurp:
        src: "{{ p1_hbr_ac04_state_dir }}/iptables-before.txt"
      register: iptables_before_file

    - name: Read sealed IPv6 Docker rules
      ansible.builtin.slurp:
        src: "{{ p1_hbr_ac04_state_dir }}/ip6tables-before.txt"
      register: ip6tables_before_file

    - name: Capture current IPv4 Docker rules
      ansible.builtin.command:
        argv: [iptables-save]
      register: iptables_after
      changed_when: false

    - name: Capture current IPv6 Docker rules
      ansible.builtin.command:
        argv: [ip6tables-save]
      register: ip6tables_after
      changed_when: false

    - name: Normalize Docker-managed rule snapshots
      ansible.builtin.set_fact:
        iptables_before_rules: >-
          {{
            (iptables_before_file.content | b64decode).splitlines()
            | reject('match', '^#')
            | list
          }}
        iptables_after_rules: >-
          {{
            iptables_after.stdout_lines
            | reject('match', '^#')
            | list
          }}
        ip6tables_before_rules: >-
          {{
            (ip6tables_before_file.content | b64decode).splitlines()
            | reject('match', '^#')
            | list
          }}
        ip6tables_after_rules: >-
          {{
            ip6tables_after.stdout_lines
            | reject('match', '^#')
            | list
          }}

    - name: Verify Docker-managed iptables rules are unchanged
      ansible.builtin.assert:
        that:
          - iptables_after_rules == iptables_before_rules
          - ip6tables_after_rules == ip6tables_before_rules
        fail_msg: >-
          Docker-managed iptables/ip6tables rules changed during AC-04.
          Stop and review before Runtime acceptance.

    - name: Verify allowed sources are present in nft set
      ansible.builtin.assert:
        that:
          - item.address | regex_replace('/32$', '') in nft_table.stdout
      loop: "{{ p1_hbr_ac04_sources }}"

    - name: Verify complete configuration state
      ansible.builtin.assert:
        that:
          - runtime_443.rc != 0
          - permanent_443.rc != 0
          - service_enabled.stdout | trim == 'enabled'
          - service_active.stdout | trim == 'active'
          - "'hook forward priority -1' in nft_table.stdout"
          - "'ct original ip daddr 10.1.93.54' in nft_table.stdout"
          - "'ct original proto-dst 443' in nft_table.stdout"
          - "'drop' in nft_table.stdout"
          - strict_forward_ports.stdout | trim == 'StrictForwardPorts=no'
          - fw_check.rc == 0
          - prestate_hash.rc == 0
          - "'docker.service' in service_order.stdout"
          - "'firewalld.service' in service_order.stdout"
        fail_msg: AC-04 persistent guard verification failed.

    - name: Print configuration verification verdict
      ansible.builtin.debug:
        msg:
          change_id: "{{ p1_hbr_ac04_change_id }}"
          persistent_guard: PASS
          generic_443: ABSENT
          docker_managed_chains_changed: false
          runtime_network_retest: REQUIRED_SEPARATELY
          state: CONFIG_VERIFY_PASS
