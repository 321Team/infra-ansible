---
# SAFETY HOLD (2026-10-01):
# Project records state that no AC-04 firewall Runtime mutation was performed
# from the rejected INPUT-only draft. A future rollback must be paired with
# the future FORWARD-path apply and its exact prestate schema.
- name: P1-HBR-01 AC-04 rollback safety hold
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Refuse rollback for a remediation that was never approved/applied
      ansible.builtin.fail:
        msg: >-
          NOT RUN: this HEAD contains no approved FORWARD-path apply and no
          corresponding rollback contract. Project state records
          RUNTIME_CHANGE=NONE for the rejected INPUT-only draft. If an
          unexpected server-side mutation is discovered, stop and reconcile
          it against independent pre-change evidence rather than guessing a
          rollback from this branch.
