---
- name: Assert exact Harbor target identity
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'harbor01'
      - ansible_hostname == (expected_hostname | default('harbor01'))
      - ansible_default_ipv4.address == hbr_ac04_host_ip
    fail_msg: Refusing AC-04 work because the target is not reviewed harbor01.

- name: Read docker service state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ hbr_ac04_docker_service }}"]
  register: hbr_ac04_docker_active
  changed_when: false
  failed_when: false

- name: Read IPv4 forwarding state
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.ip_forward]
  register: hbr_ac04_ip_forward
  changed_when: false

- name: Read FORWARD chain
  ansible.builtin.command:
    argv: [iptables, -w, "5", -t, filter, -S, FORWARD]
  register: hbr_ac04_forward_rules
  changed_when: false

- name: Read DOCKER-USER chain
  ansible.builtin.command:
    argv: [iptables, -w, "5", -t, filter, -S, DOCKER-USER]
  register: hbr_ac04_docker_user_rules
  changed_when: false
  failed_when: false

- name: Read managed AC-04 chain when present
  ansible.builtin.command:
    argv: [iptables, -w, "5", -t, filter, -S, "{{ hbr_ac04_chain }}"]
  register: hbr_ac04_managed_chain
  changed_when: false
  failed_when: false

- name: Read Docker NAT chain
  ansible.builtin.command:
    argv: [iptables, -w, "5", -t, nat, -S, DOCKER]
  register: hbr_ac04_docker_nat
  changed_when: false

- name: Read conntrack matcher capabilities
  ansible.builtin.command:
    argv: [iptables, -m, conntrack, -h]
  register: hbr_ac04_conntrack_help
  changed_when: false
  failed_when: false

- name: Read filter table source
  ansible.builtin.command:
    argv: [iptables-save, -t, filter]
  register: hbr_ac04_filter_save
  changed_when: false

- name: Read NAT table source
  ansible.builtin.command:
    argv: [iptables-save, -t, nat]
  register: hbr_ac04_nat_save
  changed_when: false

- name: Check managed filter script
  ansible.builtin.stat:
    path: "{{ hbr_ac04_filter_script }}"
    checksum_algorithm: sha256
  register: hbr_ac04_filter_script_stat

- name: Check managed systemd unit
  ansible.builtin.stat:
    path: "{{ hbr_ac04_filter_unit }}"
    checksum_algorithm: sha256
  register: hbr_ac04_filter_unit_stat

- name: Read managed service enabled state
  ansible.builtin.command:
    argv: [systemctl, is-enabled, "{{ hbr_ac04_filter_service }}"]
  register: hbr_ac04_filter_enabled
  changed_when: false
  failed_when: false

- name: Read managed service active state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ hbr_ac04_filter_service }}"]
  register: hbr_ac04_filter_active
  changed_when: false
  failed_when: false

- name: Locate Docker published host 443 DNAT rules
  ansible.builtin.set_fact:
    hbr_ac04_host443_dnat_rules: >-
      {{
        hbr_ac04_docker_nat.stdout_lines
        | select('search', '--dport 443')
        | select('search', '-j DNAT')
        | list
      }}

- name: Locate FDS jump rules in DOCKER-USER
  ansible.builtin.set_fact:
    hbr_ac04_fds_jump_rules: >-
      {{
        hbr_ac04_docker_user_rules.stdout_lines | default([])
        | select('search', '-j ' ~ hbr_ac04_chain)
        | list
      }}
