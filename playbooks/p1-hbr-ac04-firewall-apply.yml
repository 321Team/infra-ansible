---
- name: Guard P1-HBR-01 AC-04 apply target
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require exactly one reviewed harbor target
      ansible.builtin.assert:
        that:
          - groups['harbor'] | default([]) | length == 1

- name: Apply P1-HBR-01 AC-04 nftables forward guard
  hosts: harbor
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Verify inventory identity
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == expected_hostname
          - ansible_host == '10.1.93.54'

    - name: Require approved source set
      ansible.builtin.assert:
        that:
          - p1_hbr_ac04_source_set_approved | default('') == p1_hbr_ac04_change_id

    - name: Require verified control01 Harbor UI login
      ansible.builtin.assert:
        that:
          - p1_hbr_ac04_control01_ui_confirmed | default('') == p1_hbr_ac04_change_id
        fail_msg: >-
          NOT RUN: actual Harbor UI login from control01 (.102) must be
          confirmed before blocking the .26 management-PC path.

    - name: Require approved change window
      ansible.builtin.assert:
        that:
          - p1_hbr_ac04_change_window_approved | default('') == p1_hbr_ac04_change_id

    - name: Refuse a duplicate or deny-source allowlist
      ansible.builtin.assert:
        that:
          - p1_hbr_ac04_sources | length == 6
          - p1_hbr_ac04_deny_probe_source not in (p1_hbr_ac04_sources | map(attribute='address') | list)
          - p1_hbr_ac04_sources | map(attribute='address') | list | unique | length == p1_hbr_ac04_sources | length

    - name: Check existing managed table
      ansible.builtin.command:
        argv: [nft, list, table, inet, p1_hbr_ac04]
      register: existing_table
      changed_when: false
      failed_when: false

    - name: Check existing managed nft file
      ansible.builtin.stat:
        path: /etc/nftables/p1-hbr-ac04.nft
      register: nft_file_before

    - name: Check existing managed unit
      ansible.builtin.stat:
        path: /etc/systemd/system/p1-hbr-ac04-firewall.service
      register: unit_file_before

    - name: Refuse to overwrite a prior or partial managed state
      ansible.builtin.assert:
        that:
          - existing_table.rc != 0
          - not nft_file_before.stat.exists
          - not unit_file_before.stat.exists

    - name: Query runtime generic 443 before mutation
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: runtime_443_before
      changed_when: false
      failed_when: false

    - name: Query permanent generic 443 before mutation
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: permanent_443_before
      changed_when: false
      failed_when: false

    - name: Require generic 443 baseline before guard installation
      ansible.builtin.assert:
        that:
          - runtime_443_before.rc == 0
          - permanent_443_before.rc == 0

    - name: Create protected state directory
      ansible.builtin.file:
        path: "{{ p1_hbr_ac04_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Capture firewalld runtime prestate
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone={{ p1_hbr_ac04_zone }}
          - --list-all
      register: runtime_zone_before
      changed_when: false

    - name: Capture firewalld permanent prestate
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone={{ p1_hbr_ac04_zone }}
          - --list-all
      register: permanent_zone_before
      changed_when: false

    - name: Capture Docker iptables prestate
      ansible.builtin.command:
        argv: [iptables-save]
      register: iptables_before
      changed_when: false

    - name: Capture Docker ip6tables prestate
      ansible.builtin.command:
        argv: [ip6tables-save]
      register: ip6tables_before
      changed_when: false

    - name: Save structured original state
      ansible.builtin.copy:
        dest: "{{ p1_hbr_ac04_state_dir }}/original-state.json"
        owner: root
        group: root
        mode: "0600"
        content: |
          {{
            {
              'change_id': p1_hbr_ac04_change_id,
              'captured_at': ansible_date_time.iso8601,
              'hostname': ansible_facts['hostname'],
              'zone': p1_hbr_ac04_zone,
              'interface': p1_hbr_ac04_interface,
              'port': p1_hbr_ac04_port,
              'runtime_generic_443_before': (runtime_443_before.rc == 0),
              'permanent_generic_443_before': (permanent_443_before.rc == 0),
              'source_records': p1_hbr_ac04_sources,
              'deny_probe_source': p1_hbr_ac04_deny_probe_source,
              'nft_file_preexisted': nft_file_before.stat.exists,
              'unit_file_preexisted': unit_file_before.stat.exists
            } | to_nice_json
          }}

    - name: Save firewalld runtime prestate
      ansible.builtin.copy:
        dest: "{{ p1_hbr_ac04_state_dir }}/firewalld-runtime-before.txt"
        content: "{{ runtime_zone_before.stdout }}\n"
        owner: root
        group: root
        mode: "0600"

    - name: Save firewalld permanent prestate
      ansible.builtin.copy:
        dest: "{{ p1_hbr_ac04_state_dir }}/firewalld-permanent-before.txt"
        content: "{{ permanent_zone_before.stdout }}\n"
        owner: root
        group: root
        mode: "0600"

    - name: Save Docker iptables prestate
      ansible.builtin.copy:
        dest: "{{ p1_hbr_ac04_state_dir }}/iptables-before.txt"
        content: "{{ iptables_before.stdout }}\n"
        owner: root
        group: root
        mode: "0600"

    - name: Save Docker ip6tables prestate
      ansible.builtin.copy:
        dest: "{{ p1_hbr_ac04_state_dir }}/ip6tables-before.txt"
        content: "{{ ip6tables_before.stdout }}\n"
        owner: root
        group: root
        mode: "0600"

    - name: Seal prestate hashes before mutation
      ansible.builtin.shell: |
        cd {{ p1_hbr_ac04_state_dir | quote }}
        sha256sum original-state.json firewalld-runtime-before.txt           firewalld-permanent-before.txt iptables-before.txt           ip6tables-before.txt > PRESTATE_SHA256SUMS
        sha256sum -c PRESTATE_SHA256SUMS
      args:
        executable: /bin/bash
      register: prestate_hash
      changed_when: true

    - name: Require sealed prestate
      ansible.builtin.assert:
        that:
          - prestate_hash.rc == 0

  tasks:
    - name: Ensure nftables configuration directory exists
      ansible.builtin.file:
        path: /etc/nftables
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install reviewed nftables guard definition
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/p1-hbr-ac04.nft.j2"
        dest: /etc/nftables/p1-hbr-ac04.nft
        owner: root
        group: root
        mode: "0600"

    - name: Validate installed nftables guard before loading
      ansible.builtin.command:
        argv: [nft, -c, -f, /etc/nftables/p1-hbr-ac04.nft]
      register: nft_check
      changed_when: false

    - name: Install persistence unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/p1-hbr-ac04-firewall.service"
        dest: /etc/systemd/system/p1-hbr-ac04-firewall.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start guard before generic 443 removal
      ansible.builtin.systemd:
        name: p1-hbr-ac04-firewall.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Read active managed nft table
      ansible.builtin.command:
        argv: [nft, list, table, inet, p1_hbr_ac04]
      register: active_table
      changed_when: false

    - name: Verify guard shape before cutover
      ansible.builtin.assert:
        that:
          - "'hook forward priority -1' in active_table.stdout"
          - "'10.250.10.20' in active_table.stdout"
          - "'10.1.93.102' in active_table.stdout"
          - "'10.1.93.50' in active_table.stdout"
          - "'drop' in active_table.stdout"
        fail_msg: Generic 443 removal refused because nft guard is incomplete.

    - name: Remove generic 443 from permanent public zone
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone={{ p1_hbr_ac04_zone }}
          - --remove-port={{ p1_hbr_ac04_port }}/tcp

    - name: Remove generic 443 from runtime public zone without reload
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone={{ p1_hbr_ac04_zone }}
          - --remove-port={{ p1_hbr_ac04_port }}/tcp

    - name: Validate permanent firewalld config
      ansible.builtin.command:
        argv: [firewall-cmd, --check-config]
      register: fw_check
      changed_when: false

    - name: Query runtime generic 443 after cutover
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: runtime_443_after
      changed_when: false
      failed_when: false

    - name: Query permanent generic 443 after cutover
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone={{ p1_hbr_ac04_zone }}
          - --query-port={{ p1_hbr_ac04_port }}/tcp
      register: permanent_443_after
      changed_when: false
      failed_when: false

    - name: Require final configuration state
      ansible.builtin.assert:
        that:
          - runtime_443_after.rc != 0
          - permanent_443_after.rc != 0
          - fw_check.rc == 0

    - name: Save apply completion marker
      ansible.builtin.copy:
        dest: "{{ p1_hbr_ac04_state_dir }}/APPLIED.json"
        owner: root
        group: root
        mode: "0600"
        content: |
          {{
            {
              'change_id': p1_hbr_ac04_change_id,
              'applied_at': ansible_date_time.iso8601,
              'approved_sources': p1_hbr_ac04_sources,
              'guard': 'inet p1_hbr_ac04 / forward priority -1',
              'generic_443_removed': true
            } | to_nice_json
          }}

    - name: Print apply verdict
      ansible.builtin.debug:
        msg:
          change_id: "{{ p1_hbr_ac04_change_id }}"
          host: "{{ inventory_hostname }}"
          enforcement: NFT_FORWARD_PRIORITY_MINUS_1
          docker_managed_chains_changed: false
          strict_forward_ports_changed: false
          generic_443: REMOVED
          state: APPLY_PASS_RETEST_REQUIRED
