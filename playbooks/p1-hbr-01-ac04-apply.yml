---
# SAFETY HOLD (2026-10-01):
# The original INPUT-only implementation is intentionally disabled.
# Harbor HTTPS is Docker-published and traverses DNAT/FORWARD/DOCKER-USER.
# Do not restore the old implementation. Rebuild apply only after the
# read-only forward discovery is reviewed and the enforcement path is fixed.
- name: P1-HBR-01 AC-04 apply safety hold
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Refuse Runtime mutation until FORWARD enforcement design is reviewed
      ansible.builtin.fail:
        msg: >-
          NOT RUN: P1-HBR-01 AC-04 INPUT-only remediation was rejected.
          Harbor 443 follows PREROUTING DNAT -> FORWARD -> DOCKER-USER ->
          DOCKER-FORWARD -> DOCKER. Run and review
          playbooks/p1-hbr-01-ac04-forward-discover.yml first, then replace
          this safety hold with the independently reviewed FORWARD-path
          implementation. Runtime firewall mutation is prohibited at this HEAD.
