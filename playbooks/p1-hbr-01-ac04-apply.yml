---
- name: P1-HBR-01 AC-04 apply authorization gate
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Require explicit approval, UI fallback and change-window attestations
      ansible.builtin.assert:
        that:
          - (hbr_ac04_change_approved | default('')) == 'P1-HBR-01-AC04'
          - (hbr_ac04_ui_fallback_confirmed | default('')) == 'P1-HBR-01-AC04'
          - (hbr_ac04_change_window_confirmed | default('')) == 'P1-HBR-01-AC04'
        fail_msg: >-
          NOT RUN. Apply requires the reviewed change approval, confirmed
          control01 Harbor UI fallback, and a change window that does not
          overlap P1-HA-01 Drain or monitoring image rollout.

- name: P1-HBR-01 AC-04 apply host firewall source allowlist
  hosts: hbr
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Observe current harbor01 firewall state
      ansible.builtin.include_tasks: tasks/p1-hbr-01-ac04-observe.yml

    - name: Check for an existing AC-04 change state
      ansible.builtin.stat:
        path: "{{ hbr_ac04_state_dir }}/original-state.json"
      register: hbr_ac04_existing_state

    - name: Assert immutable pre-change contract before first mutation
      ansible.builtin.assert:
        that:
          - hbr_ac04_runtime_generic.rc == 0
          - hbr_ac04_permanent_generic.rc == 0
          - "'https' not in hbr_ac04_runtime_services.stdout.split()"
          - "'https' not in hbr_ac04_permanent_services.stdout.split()"
          - >-
            (hbr_ac04_runtime_rich.stdout_lines
             | select('search', 'port port="443"')
             | list | length) == 0
          - >-
            (hbr_ac04_permanent_rich.stdout_lines
             | select('search', 'port port="443"')
             | list | length) == 0
          - hbr_ac04_zone_xml_stat.stat.exists
          - not hbr_ac04_existing_state.stat.exists
        fail_msg: >-
          Prestate changed or an earlier change cycle exists. No firewall
          mutation is allowed until the state is reconciled.

    - name: Capture KST prestate timestamp
      ansible.builtin.command:
        argv: [date, --iso-8601=seconds]
      register: hbr_ac04_captured_at
      changed_when: false

    - name: Create root-owned AC-04 state directory
      ansible.builtin.file:
        path: "{{ hbr_ac04_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Preserve permanent public zone XML before mutation
      ansible.builtin.copy:
        src: "{{ hbr_ac04_zone_xml }}"
        dest: "{{ hbr_ac04_state_dir }}/original-public.xml"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Hash preserved zone XML
      ansible.builtin.stat:
        path: "{{ hbr_ac04_state_dir }}/original-public.xml"
        checksum_algorithm: sha256
      register: hbr_ac04_original_zone_copy

    - name: Build immutable original-state record
      ansible.builtin.set_fact:
        hbr_ac04_original_state:
          schema: 1
          change_id: "{{ hbr_ac04_change_id }}"
          captured_at_kst: "{{ hbr_ac04_captured_at.stdout | trim }}"
          inventory_hostname: "{{ inventory_hostname }}"
          ansible_hostname: "{{ ansible_hostname }}"
          address: "{{ ansible_default_ipv4.address }}"
          zone: "{{ hbr_ac04_zone }}"
          interface: "{{ hbr_ac04_interface }}"
          runtime_generic_443_present: "{{ hbr_ac04_runtime_generic.rc == 0 }}"
          permanent_generic_443_present: "{{ hbr_ac04_permanent_generic.rc == 0 }}"
          runtime_ports: "{{ hbr_ac04_runtime_ports.stdout.split() }}"
          permanent_ports: "{{ hbr_ac04_permanent_ports.stdout.split() }}"
          runtime_services: "{{ hbr_ac04_runtime_services.stdout.split() }}"
          permanent_services: "{{ hbr_ac04_permanent_services.stdout.split() }}"
          runtime_rich_rules: "{{ hbr_ac04_runtime_rich.stdout_lines }}"
          permanent_rich_rules: "{{ hbr_ac04_permanent_rich.stdout_lines }}"
          original_public_xml_sha256: "{{ hbr_ac04_original_zone_copy.stat.checksum }}"
          approved_sources: "{{ hbr_ac04_sources }}"
          denied_same_l2_source: "{{ hbr_ac04_denied_same_l2_source }}"
          mgmt_negative_source: "{{ hbr_ac04_mgmt_negative_source }}"

    - name: Write immutable original-state record
      ansible.builtin.copy:
        dest: "{{ hbr_ac04_state_dir }}/original-state.json"
        content: "{{ hbr_ac04_original_state | to_nice_json }}\n"
        owner: root
        group: root
        mode: "0600"

    - name: Apply reviewed source allowlist without firewalld reload
      block:
        - name: Add permanent source-specific 443 rich rules first
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - --permanent
              - "--zone={{ hbr_ac04_zone }}"
              - "--add-rich-rule={{ item }}"
          loop: "{{ hbr_ac04_expected_rules }}"

        - name: Add runtime source-specific 443 rich rules
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - "--zone={{ hbr_ac04_zone }}"
              - "--add-rich-rule={{ item }}"
          loop: "{{ hbr_ac04_expected_rules }}"

        - name: Remove permanent generic 443 only after allow rules exist
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - --permanent
              - "--zone={{ hbr_ac04_zone }}"
              - "--remove-port={{ hbr_ac04_generic_port }}"

        - name: Remove runtime generic 443 only after allow rules exist
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - "--zone={{ hbr_ac04_zone }}"
              - "--remove-port={{ hbr_ac04_generic_port }}"

        - name: Validate permanent firewalld configuration
          ansible.builtin.command:
            argv: [firewall-cmd, --check-config]
          changed_when: false

        - name: Re-observe firewall after apply
          ansible.builtin.include_tasks: tasks/p1-hbr-01-ac04-observe.yml

        - name: Assert desired firewalld state after apply
          ansible.builtin.assert:
            that:
              - hbr_ac04_runtime_generic.rc == 1
              - hbr_ac04_permanent_generic.rc == 1
              - >-
                (hbr_ac04_runtime_rich.stdout_lines
                 | select('search', 'port port="443"') | list | sort)
                == (hbr_ac04_expected_rules | sort)
              - >-
                (hbr_ac04_permanent_rich.stdout_lines
                 | select('search', 'port port="443"') | list | sort)
                == (hbr_ac04_expected_rules | sort)
            fail_msg: Apply did not converge to the reviewed source allowlist.

      rescue:
        - name: Rescue - restore permanent generic 443 first
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - --permanent
              - "--zone={{ hbr_ac04_zone }}"
              - "--add-port={{ hbr_ac04_generic_port }}"
          failed_when: false

        - name: Rescue - restore runtime generic 443
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - "--zone={{ hbr_ac04_zone }}"
              - "--add-port={{ hbr_ac04_generic_port }}"
          failed_when: false

        - name: Rescue - remove permanent AC-04 rich rules
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - --permanent
              - "--zone={{ hbr_ac04_zone }}"
              - "--remove-rich-rule={{ item }}"
          loop: "{{ hbr_ac04_expected_rules }}"
          failed_when: false

        - name: Rescue - remove runtime AC-04 rich rules
          ansible.builtin.command:
            argv:
              - firewall-cmd
              - "--zone={{ hbr_ac04_zone }}"
              - "--remove-rich-rule={{ item }}"
          loop: "{{ hbr_ac04_expected_rules }}"
          failed_when: false

        - name: Stop after rescue
          ansible.builtin.fail:
            msg: >-
              AC-04 apply failed and best-effort rescue was executed.
              Run the reviewed rollback playbook and verify the preserved
              original-state.json before any retry.

    - name: Capture KST apply completion timestamp
      ansible.builtin.command:
        argv: [date, --iso-8601=seconds]
      register: hbr_ac04_applied_at
      changed_when: false

    - name: Write apply marker
      ansible.builtin.copy:
        dest: "{{ hbr_ac04_state_dir }}/applied.txt"
        content: |
          change_id={{ hbr_ac04_change_id }}
          applied_at_kst={{ hbr_ac04_applied_at.stdout | trim }}
          host={{ inventory_hostname }}
          generic_443=REMOVED
          source_rules={{ hbr_ac04_expected_rules | length }}
          reload=NOT_USED
        owner: root
        group: root
        mode: "0600"
