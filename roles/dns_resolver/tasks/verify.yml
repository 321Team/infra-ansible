---
- name: Read post-run NetworkManager IPv4 DNS servers
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - ipv4.dns
      - connection
      - show
      - "{{ cr_dns_active_connection.stdout | trim }}"
  register: cr_dns_connection_dns_after
  changed_when: false
  check_mode: false

- name: Read post-run NetworkManager IPv4 search domains
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - ipv4.dns-search
      - connection
      - show
      - "{{ cr_dns_active_connection.stdout | trim }}"
  register: cr_dns_connection_search_after
  changed_when: false
  check_mode: false

- name: Read post-run NetworkManager automatic DNS setting
  ansible.builtin.command:
    argv:
      - nmcli
      - --get-values
      - ipv4.ignore-auto-dns
      - connection
      - show
      - "{{ cr_dns_active_connection.stdout | trim }}"
  register: cr_dns_connection_ignore_auto_after
  changed_when: false
  check_mode: false

- name: Read post-run resolver file
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: cr_dns_resolv_conf_after

- name: Verify persistent resolver target state
  ansible.builtin.assert:
    that:
      - >-
        (cr_dns_connection_dns_after.stdout | trim | replace(',', ' ')).split()
        == cr_dns_servers
      - >-
        (cr_dns_connection_search_after.stdout | trim | replace(',', ' ')).split()
        == cr_dns_search_domains
      - cr_dns_connection_ignore_auto_after.stdout | trim | lower == 'yes'
      - >-
        (cr_dns_resolv_conf_after.content | b64decode).find(
          'nameserver ' ~ cr_dns_servers[0]) >= 0
      - >-
        (cr_dns_resolv_conf_after.content | b64decode).find(
          'nameserver ' ~ cr_dns_servers[1]) >= 0
      - >-
        (cr_dns_resolv_conf_after.content | b64decode).find(
          'nameserver ' ~ cr_dns_servers[0])
        < (cr_dns_resolv_conf_after.content | b64decode).find(
          'nameserver ' ~ cr_dns_servers[1])
      - >-
        ('search ' ~ cr_dns_search_domains | join(' '))
        in (cr_dns_resolv_conf_after.content | b64decode)
    fail_msg: >-
      Persistent or live resolver state does not match {{ cr_dns_change_id }}
      on {{ inventory_hostname }}.
  when:
    - cr_dns_phase in ['apply', 'verify']
    - not ansible_check_mode

- name: Verify internal FQDN resolution through the active resolver
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ cr_dns_internal_name }}"
  register: cr_dns_internal_after
  changed_when: false
  check_mode: false
  failed_when: cr_dns_expected_address not in cr_dns_internal_after.stdout
  when:
    - cr_dns_phase in ['apply', 'verify']
    - not ansible_check_mode

- name: Verify internal short-name resolution through the search domain
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ cr_dns_short_name }}"
  register: cr_dns_short_after
  changed_when: false
  check_mode: false
  failed_when: cr_dns_expected_address not in cr_dns_short_after.stdout
  when:
    - cr_dns_phase in ['apply', 'verify']
    - not ansible_check_mode

- name: Verify direct query through each approved DNS server after run
  ansible.builtin.command:
    argv:
      - dig
      - +time=2
      - +tries=1
      - +short
      - "@{{ item }}"
      - "{{ cr_dns_internal_name }}"
      - A
  loop: "{{ cr_dns_servers }}"
  register: cr_dns_direct_queries_after
  changed_when: false
  check_mode: false
  failed_when: >-
    cr_dns_direct_queries_after.rc != 0
    or cr_dns_expected_address not in cr_dns_direct_queries_after.stdout_lines

- name: Verify external name resolution after run
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ cr_dns_external_name }}"
  register: cr_dns_external_after
  changed_when: false
  check_mode: false

- name: Verify Kubernetes API listener after run
  ansible.builtin.wait_for:
    host: "{{ cr_dns_expected_address }}"
    port: 6443
    state: started
    connect_timeout: 2
    timeout: 3

- name: Read post-run kubelet state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --value
      - kubelet.service
  register: cr_dns_kubelet_after
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read post-run containerd state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --value
      - containerd.service
  register: cr_dns_containerd_after
  changed_when: false
  check_mode: false
  failed_when: false

- name: Verify node service state did not regress
  ansible.builtin.assert:
    that:
      - cr_dns_kubelet_after.stdout == cr_dns_kubelet_before.stdout
      - cr_dns_containerd_after.stdout == cr_dns_containerd_before.stdout
    fail_msg: >-
      kubelet or containerd state changed during {{ cr_dns_change_id }} on
      {{ inventory_hostname }}. Missing services remain valid only when both
      pre-run and post-run states are identical.

- name: Print CR DNS node verdict
  ansible.builtin.debug:
    msg:
      change_id: "{{ cr_dns_change_id }}"
      host: "{{ inventory_hostname }}"
      phase: "{{ cr_dns_phase }}"
      interface: "{{ ansible_default_ipv4.interface }}"
      connection: "{{ cr_dns_active_connection.stdout | trim }}"
      dns: >-
        {{ (cr_dns_connection_dns_after.stdout | trim | replace(',', ' ')).split() }}
      search: >-
        {{ (cr_dns_connection_search_after.stdout | trim | replace(',', ' ')).split() }}
      ignore_auto_dns: >-
        {{ cr_dns_connection_ignore_auto_after.stdout | trim | lower }}
      direct_queries: "2/2 PASS"
      external_resolution: PASS
      api_listener: PASS
      service_regression: NONE
