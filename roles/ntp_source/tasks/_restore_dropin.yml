---
# Caller supplies the invocation snapshot (automatic rescue) or the immutable
# baseline (manual CR rollback). Validation happens before any mutation.
- name: Validate state before restoring
  ansible.builtin.include_tasks: _validate_state.yml

- name: Inspect restore target
  ansible.builtin.stat:
    path: "{{ cr_ntp_dropin_path }}"
  register: cr_ntp_restore_target

- name: Refuse an unsafe restore target
  ansible.builtin.assert:
    that:
      - >-
        not cr_ntp_restore_target.stat.exists or
        (cr_ntp_restore_target.stat.isreg | default(false) and
         not (cr_ntp_restore_target.stat.islnk | default(false)) and
         cr_ntp_restore_target.stat.nlink | default(0) == 1)

- name: Remove drop-in that did not exist before this change
  ansible.builtin.file:
    path: "{{ cr_ntp_dropin_path }}"
    state: absent
  when: not cr_ntp_restore_state.dropin_existed

- name: Restore drop-in that existed before this change
  ansible.builtin.copy:
    dest: "{{ cr_ntp_dropin_path }}"
    content: "{{ cr_ntp_restore_state.dropin_content_b64 | b64decode }}"
    owner: "{{ cr_ntp_restore_state.uid | string }}"
    group: "{{ cr_ntp_restore_state.gid | string }}"
    mode: "{{ cr_ntp_restore_state.mode }}"
  when: cr_ntp_restore_state.dropin_existed

- name: Restart chronyd after restoring the original drop-in
  ansible.builtin.systemd:
    name: chronyd
    state: restarted
  when: not ansible_check_mode

- name: Wait for chronyd to report active after restore
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - chronyd.service
  register: cr_ntp_active_after_restore
  changed_when: false
  retries: 5
  delay: 2
  until: cr_ntp_active_after_restore.stdout == "active"
  when: not ansible_check_mode
