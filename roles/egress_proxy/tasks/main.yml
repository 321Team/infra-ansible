---
- name: Validate CR-P1-MON-01-01 egress proxy phase and variables
  ansible.builtin.assert:
    that:
      - cr_mon_phase in ['precheck', 'apply', 'verify']
      - cr_mon_allowed_domains | length > 0
      - cr_mon_proxy_port | int > 0
      - cr_mon_proxy_allowed_clients | length > 0
    fail_msg: >-
      Invalid {{ cr_mon_change_id }} egress proxy inputs or phase.

- name: Require explicit approval token for proxy changes
  ansible.builtin.assert:
    that:
      - cr_mon_change_approved | default('') == cr_mon_change_id
    fail_msg: >-
      Set cr_mon_change_approved={{ cr_mon_change_id }} only for an approved
      apply run.
  when: cr_mon_phase == 'apply'

- name: Verify firewalld is active before making any changes
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --state
  register: cr_mon_firewalld_state
  changed_when: false
  check_mode: false
  failed_when: cr_mon_firewalld_state.stdout | trim != 'running'

- name: Read the default firewalld zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --get-default-zone
  register: cr_mon_firewalld_zone
  changed_when: false
  check_mode: false

- name: Check whether squid is already installed
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - squid
  register: cr_mon_squid_preinstalled
  changed_when: false
  check_mode: false
  failed_when: false

- name: Check for existing squid configuration
  ansible.builtin.stat:
    path: /etc/squid/squid.conf
  register: cr_mon_squid_conf_before

- name: Read pre-change squid service state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --value
      - squid.service
  register: cr_mon_squid_service_before
  changed_when: false
  check_mode: false

- name: Read pre-change squid enabled state
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - squid.service
  register: cr_mon_squid_enabled_before
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read pre-change kubelet state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --value
      - kubelet.service
  register: cr_mon_kubelet_before
  changed_when: false
  check_mode: false
  failed_when: false

- name: Normalize pre-change kubelet state for evidence
  ansible.builtin.set_fact:
    cr_mon_kubelet_before_load: >-
      {{ (cr_mon_kubelet_before.stdout_lines | default([]))[0] | default('unknown') }}
    cr_mon_kubelet_before_active: >-
      {{ (cr_mon_kubelet_before.stdout_lines | default([]))[1] | default('unknown') }}

- name: Read current permanent firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --list-rich-rules
  register: cr_mon_firewalld_rules_before
  changed_when: false
  check_mode: false

- name: Read current runtime-only firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --list-rich-rules
  register: cr_mon_firewalld_runtime_rules_before
  changed_when: false
  check_mode: false

- name: Create protected CR rollback state directory
  ansible.builtin.file:
    path: "{{ cr_mon_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode

- name: Preserve original squid configuration once
  ansible.builtin.copy:
    remote_src: true
    src: /etc/squid/squid.conf
    dest: "{{ cr_mon_state_dir }}/original-squid.conf"
    owner: root
    group: root
    mode: "0600"
    force: false
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode
    - cr_mon_squid_conf_before.stat.exists

- name: Preserve original squid and firewalld state once
  ansible.builtin.copy:
    dest: "{{ cr_mon_state_dir }}/original-state.json"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: >-
      {{
        {
          'change_id': cr_mon_change_id,
          'captured_at': ansible_date_time.iso8601,
          'inventory_hostname': inventory_hostname,
          'squid_preinstalled': cr_mon_squid_preinstalled.rc == 0,
          'squid_conf_preexisted': cr_mon_squid_conf_before.stat.exists,
          'squid_conf_owner': cr_mon_squid_conf_before.stat.pw_name | default('root'),
          'squid_conf_group': cr_mon_squid_conf_before.stat.gr_name | default('root'),
          'squid_conf_mode': cr_mon_squid_conf_before.stat.mode | default('0644'),
          'squid_service_load_state': cr_mon_squid_service_before.stdout_lines[0],
          'squid_service_active_state': cr_mon_squid_service_before.stdout_lines[1],
          'squid_service_enabled_state': cr_mon_squid_enabled_before.stdout | trim,
          'kubelet_load_state_before': cr_mon_kubelet_before_load,
          'kubelet_active_state_before': cr_mon_kubelet_before_active,
          'firewalld_default_zone': cr_mon_firewalld_zone.stdout | trim,
          'firewalld_permanent_rules_before': cr_mon_firewalld_rules_before.stdout_lines,
          'firewalld_runtime_rules_before': cr_mon_firewalld_runtime_rules_before.stdout_lines
        } | to_nice_json
      }}
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode

- name: Install squid
  ansible.builtin.dnf:
    name: squid
    state: present
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode

- name: Deploy discord.com-only egress allowlist configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: restart squid
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode

- name: Open the proxy port for approved internal clients only (permanent)
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --add-rich-rule=rule family="ipv4" source
        address="{{ item }}" port port="{{ cr_mon_proxy_port }}"
        protocol="tcp" accept
  loop: "{{ cr_mon_proxy_allowed_clients }}"
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode
    - ('source address=\"' + item + '\" port port=\"' + (cr_mon_proxy_port | string) + '\" protocol=\"tcp\" accept') not in cr_mon_firewalld_rules_before.stdout
  changed_when: true

- name: Open the proxy port for approved internal clients only (runtime, no reload)
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --add-rich-rule=rule family="ipv4" source
        address="{{ item }}" port port="{{ cr_mon_proxy_port }}"
        protocol="tcp" accept
  loop: "{{ cr_mon_proxy_allowed_clients }}"
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode
    - ('source address=\"' + item + '\" port port=\"' + (cr_mon_proxy_port | string) + '\" protocol=\"tcp\" accept') not in cr_mon_firewalld_runtime_rules_before.stdout
  changed_when: true

- name: Enable and start squid
  ansible.builtin.service:
    name: squid
    enabled: true
    state: started
  when:
    - cr_mon_phase == 'apply'
    - not ansible_check_mode

- name: Apply notified squid restart handler
  ansible.builtin.meta: flush_handlers

- name: Run CR-P1-MON-01-01 post-run verification tasks
  ansible.builtin.include_tasks: verify.yml
  when:
    - cr_mon_phase in ['apply', 'verify']
    - not ansible_check_mode
