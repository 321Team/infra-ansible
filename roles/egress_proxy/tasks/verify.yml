---
- name: Read post-run squid service state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --value
      - squid.service
  register: cr_mon_squid_service_after
  changed_when: false
  check_mode: false

- name: Assert squid is active
  ansible.builtin.assert:
    that:
      - "'active' in cr_mon_squid_service_after.stdout"
    fail_msg: >-
      squid.service is not active on {{ inventory_hostname }} after
      {{ cr_mon_change_id }}.

- name: Read post-run kubelet state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --value
      - kubelet.service
  register: cr_mon_kubelet_after
  changed_when: false
  check_mode: false
  failed_when: false

- name: Assert kubelet state did not regress
  ansible.builtin.assert:
    that:
      - cr_mon_kubelet_after.stdout == cr_mon_kubelet_before.stdout
    fail_msg: >-
      kubelet state changed during {{ cr_mon_change_id }} on
      {{ inventory_hostname }}. This role must not affect cluster membership
      of a node that still runs as a Kubernetes worker or control-plane node.

- name: Verify an allowed destination is reachable through the proxy
  ansible.builtin.uri:
    url: "https://{{ cr_mon_allowed_domains[0] }}"
    proxy_host: 127.0.0.1
    proxy_port: "{{ cr_mon_proxy_port }}"
    validate_certs: true
    status_code:
      - 200
      - 301
      - 302
      - 308
  register: cr_mon_allowed_probe
  changed_when: false
  check_mode: false

- name: Verify a non-allowed destination is denied by the proxy
  ansible.builtin.uri:
    url: "https://{{ cr_mon_denied_probe_domain }}"
    proxy_host: 127.0.0.1
    proxy_port: "{{ cr_mon_proxy_port }}"
    validate_certs: true
    status_code:
      - 403
  register: cr_mon_denied_probe
  changed_when: false
  check_mode: false
  failed_when: false

- name: Assert the non-allowed destination was actually denied
  ansible.builtin.assert:
    that:
      - cr_mon_denied_probe.status | default(0) == 403
    fail_msg: >-
      {{ cr_mon_change_id }} allowlist did not deny
      {{ cr_mon_denied_probe_domain }} through the proxy on
      {{ inventory_hostname }}. Squid must reject any destination outside
      cr_mon_allowed_domains.

- name: Print CR-P1-MON-01-01 node verdict
  ansible.builtin.debug:
    msg:
      change_id: "{{ cr_mon_change_id }}"
      host: "{{ inventory_hostname }}"
      phase: "{{ cr_mon_phase }}"
      squid_state: "{{ cr_mon_squid_service_after.stdout }}"
      allowed_domain_probe: "{{ cr_mon_allowed_probe.status }}"
      denied_domain_probe: "{{ cr_mon_denied_probe.status | default('n/a') }}"
      kubelet_regression: NONE
