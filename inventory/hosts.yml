---
all:
  children:
    k8s_nodes:
      children:
        k8s_control_plane:
          hosts:
            k8s-control01:
              ansible_host: 10.1.93.102
              expected_hostname: k8s-control01

            k8s-control02:
              ansible_host: 10.1.93.103
              expected_hostname: k8s-control02

            k8s-control03:
              ansible_host: 10.1.93.104
              expected_hostname: k8s-control03

        k8s_workers:
          hosts:
            k8s-worker01:
              ansible_host: 10.1.93.105
              expected_hostname: k8s-worker01

            k8s-worker02:
              ansible_host: 10.1.93.107
              expected_hostname: k8s-worker02

            k8s-worker03:
              ansible_host: 10.1.93.108
              expected_hostname: k8s-worker03

    # P1-HBR-01: Harbor single-node registry target.
    # Added for AC-04 host-firewall remediation so apply/verify/rollback
    # always bind to a reviewed inventory identity instead of ad-hoc -i IP.
    harbor:
      hosts:
        harbor01:
          ansible_host: 10.1.93.54
          expected_hostname: harbor01

    # CR-P1-MON-01-01: dedicated Alertmanager egress proxy host.
    # Confirmed by DEC-P1-EGRESS-01 (fds-project-baseline#78): a new
    # non-K8s VM on server08, not a repurposed k8s_nodes member.
    egress_proxy:
      hosts:
        egress-proxy01:
          ansible_host: 10.1.93.56
          expected_hostname: egress-proxy01

    # P1-SEC-01 #58: edge01 is the approved external source (10.1.93.50)
    # for NodePort 30080 positive/negative access and
    # externalTrafficPolicy: Local source-IP preservation verification.
    edge:
      hosts:
        edge01:
          ansible_host: 10.1.93.50
          expected_hostname: edge01

  vars:
    ansible_user: svc_ansible
    ansible_python_interpreter: /usr/bin/python3
